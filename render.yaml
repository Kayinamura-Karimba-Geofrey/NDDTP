services:
  # 1. API Gateway Service
  - type: web
    name: nddtp-api-gateway
    runtime: docker
    dockerfilePath: NDDP-BACKEND/api-gateway/Dockerfile
    dockerContext: NDDP-BACKEND/api-gateway
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      # Public URL of the auth service, e.g. https://nddtp-auth-service.onrender.com
      - key: SERVICE_URL_AUTH
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # 2. Authentication Microservice
  - type: web
    name: nddtp-auth-service
    runtime: docker
    dockerfilePath: NDDP-BACKEND/services/auth-service/Dockerfile
    dockerContext: NDDP-BACKEND/services/auth-service
    plan: free
    region: oregon
    envVars:
      - key: APP_PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # set in the Render dashboard — never commit credentials
      - key: REDIS_HOST
        fromService:
          type: redis
          name: nddtp-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: nddtp-redis
          property: port

  # 3. Enterprise Frontend (Static Site)
  - type: web
    name: nddtp-frontend
    runtime: static
    buildCommand: cd NDDP-FRONTEND && npm install && npm run build
    staticPublishPath: NDDP-FRONTEND/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 4. Redis Cache & Session Store
  - type: redis
    name: nddtp-redis
    plan: free
    ipAllowList: []



