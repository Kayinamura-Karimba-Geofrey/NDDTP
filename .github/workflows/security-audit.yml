name: Security & Backdoor Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Security & Lockfile Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'NDDP-BACKEND/package-lock.json'

      - name: Verify Lockfile Integrity & Clean Install
        run: |
          cd NDDP-BACKEND
          npm ci --ignore-scripts

      # Production dependencies only. Level is "critical" until auth-service moves to NestJS 11
      # (GHSA-36xv-jgw5-4q75 in @nestjs/core <=11.1.17 has no fix on the v10 line) and braces
      # ships a fix for GHSA-vfj7-8cjw-p6xm. Raise to "high" once those are resolved.
      - name: Audit backend workspace (production deps)
        run: |
          cd NDDP-BACKEND
          npm audit --omit=dev --audit-level=critical

      - name: Audit auth-service Docker lockfile (production deps)
        run: |
          cd NDDP-BACKEND/services/auth-service
          npm audit --omit=dev --audit-level=critical --workspaces=false

      - name: Audit API gateway (production deps)
        run: |
          cd NDDP-BACKEND/api-gateway
          npm audit --omit=dev --audit-level=critical

      - name: Audit frontend (production deps)
        run: |
          cd NDDP-FRONTEND
          npm audit --omit=dev --audit-level=high

      - name: Scan for Backdoor & Script Vectors
        run: |
          echo "Scanning for executable script extensions..."
          FOUND=$(find . -type f \( -name "*.cmd" -o -name "*.ps1" -o -name "*.vbs" -o -name "*.bat" \) -not -path "*/node_modules/*")
          if [ -n "$FOUND" ]; then
            echo "ERROR: Suspicious script vectors detected:"
            echo "$FOUND"
            exit 1
          fi
          echo "Scan completed cleanly. No suspicious script vectors detected."
